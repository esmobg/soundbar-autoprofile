# soundbar-autoprofile configuration
#
# Profiles say WHAT to put on the soundbar; rules say WHEN. Rules are checked top to bottom and the first match
# wins. If nothing matches, `default_profile` is used. Run `gs5 detect --watch` to see the values the rules
# are matched against while you use your computer.
#
# Text conditions are case-insensitive regular expressions ("spotify|music" matches either word); a list means
# "any of these". true/false conditions must be equal. `unless` excludes a rule even if `when` matches.
#
# Fields: media_playing, media_app, media_title, media_artist, media_type (music/video/""), foreground_app,
#         foreground_title, fullscreen, mic_in_use, mic_apps

device: gs5

# seconds a new profile must stay chosen before switching (no flapping when you alt-tab for a moment)
hold_seconds: 3
# after media stops, keep treating it as playing for this long (pausing or skipping does not switch away)
media_grace_seconds: 15
# how often to look at what is happening, in seconds
poll_seconds: 1
# re-assert the lighting this often (the GS5 strip can go dark on standby); 0 = never
keepalive_seconds: 120

default_profile: default

profiles:
  # sound_mode: a Sound Mode from Creative App (Windows). It carries the EQ, SuperWide, Crystalizer, Bass, Smart
  #   Volume and Dialog+ settings. Use the name shown in the app: a factory one ("Music", "Movies", "Gaming",
  #   "Effects Off", ...) or one you made yourself. `gs5 modes` lists them. Creative App is started minimized
  #   when needed.
  # rgb: one RRGGBB colour for the whole strip, or 7 colours left to right. brightness: 0-100.
  # frames: raw hex frames sent to the soundbar as-is (advanced).
  music:
    sound_mode: Music
    rgb: "8a2be2"
    brightness: 70
  movie:
    sound_mode: Movies
    rgb: "ff5a00"
    brightness: 30
  work:
    sound_mode: Effects Off
    rgb: "4aa8ff"
    brightness: 50
  game:
    sound_mode: Gaming
    rgb: "ff0030"
    brightness: 100
  default:
    sound_mode: Effects Off
    rgb: "ffffff"
    brightness: 40

rules:
  - name: call or meeting (microphone in use)
    profile: work
    when:
      mic_in_use: true

  - name: full-screen game
    profile: game
    when:
      fullscreen: true
    unless:
      foreground_app: &players_and_browsers
        - "chrome|chromium|msedge|firefox|librewolf|waterfox|brave|opera|vivaldi|safari|arc|epiphany"
        - "vlc|mpv|mpc-hc|mpc-be|potplayer|kodi|plex|netflix|stremio|iina|quicktime|infuse|wmplayer|video.ui"
        - "microsoft\\.media\\.player|totem|showtime|celluloid|haruna|smplayer|clapper|^tv$"
        - "explorer|finder|code|powerpnt|keynote"

  - name: video player or streaming service
    profile: movie
    when:
      media_playing: true
      media_app:
        - "vlc|mpv|mpc|potplayer|kodi|plex|netflix|disney|prime ?video|stremio|iina|zunevideo|films & tv"
        - "apple tv|tv\\.app|com\\.apple\\.tv\\b|totem|showtime|celluloid|haruna|smplayer|clapper|dragonplayer"

  - name: video playing (player reports video)
    profile: movie
    when:
      media_type: video

  - name: streaming site in the title
    profile: movie
    when:
      media_playing: true
      media_title: "netflix|disney\\+|hbo|prime video|apple tv|trailer|episode|\\bs\\d\\de\\d\\d\\b"

  - name: full-screen browser video
    profile: movie
    when:
      media_playing: true
      fullscreen: true
      foreground_app: *players_and_browsers

  - name: music app or anything else playing
    profile: music
    when:
      media_playing: true

  - name: work apps
    profile: work
    when:
      foreground_app:
        - "code|devenv|idea|pycharm|webstorm|rider|clion|goland|sublime|notepad|cursor|zed"
        - "winword|excel|powerpnt|outlook|onenote|teams|slack|zoom|notion|obsidian|figma"
        - "terminal|^cmd|powershell|iterm|konsole|alacritty|kitty|claude"
